spring:
  application:
    name: resident-service
  cloud:
    config:
      uri: http://localhost:8888
      name: resident-service
      profile: dev
  config:
    import: optional:configserver:http://localhost:8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true